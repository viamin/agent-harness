name: Release Please

on:
  push:
    branches:
      - main
    tags:
      - "agent-harness/v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Release Please must finish the run triggered by merging a release PR.
  # A later main push can otherwise cancel that release run and inherit pending
  # release work in the wrong event context.
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          # Only release PR merge commits should mint GitHub releases. Normal
          # main pushes still let release-please create/update the next release
          # PR, but they do not retry stale pending release PRs.
          skip-github-release: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"

  push-gem:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest
    needs: release-please
    if: "${{ always() && (needs.release-please.outputs.release-created == 'true' || startsWith(github.ref, 'refs/tags/agent-harness/v')) }}"

    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write # IMPORTANT: this permission is required for `rake release` to push the release tag

    steps:
      # Set up
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          bundler-cache: true
          ruby-version: ruby

      # Release
      - uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092
