name: Release Please

on:
  push:
    branches:
      - main
    tags:
      - "agent-harness/v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing immutable version to verify without publishing
        required: true
        default: "0.46.2"
      sha256:
        description: Expected SHA256 from the original publication
        required: true
        default: "c026bd3457a765ab599cb0446dc182f200d7797da4bb817b8ab35ca7d90ef170"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Release Please must finish the run triggered by merging a release PR.
  # A later main push can otherwise cancel that release run and inherit pending
  # release work in the wrong event context.
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          # Only release PR merge commits should mint GitHub releases. Normal
          # main pushes still let release-please create/update the next release
          # PR, but they do not retry stale pending release PRs.
          skip-github-release: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"

  push-gem:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest
    needs: release-please
    if: "${{ always() && github.event_name == 'push' && (needs.release-please.outputs.release-created == 'true' || startsWith(github.ref, 'refs/tags/agent-harness/v')) }}"

    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write # IMPORTANT: this permission is required for `rake release` to push the release tag

    steps:
      # Set up
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0
        with:
          bundler-cache: true
          ruby-version: 3.4.12

      - name: Build release artifact
        run: bundle exec rake build
      - name: Check for an immutable existing release
        id: existing
        shell: bash
        run: |
          set +e
          bundle exec ruby script/verify_rubygems_release.rb --attempts 1 --interval 0 pkg/*.gem
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      # Release
      - name: Publish gem with trusted publishing
        if: steps.existing.outputs.published != 'true'
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b
        with:
          # rubygems-await 0.5.4 calls a removed private RubyGems cache API.
          # Verification below uses the supported public version endpoint.
          await-release: false
      - name: Verify published version and checksum
        run: bundle exec ruby script/verify_rubygems_release.rb --attempts 30 --interval 10 pkg/*.gem

  verify-gem:
    name: Verify existing gem on RubyGems.org
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0
        with:
          bundler-cache: true
          ruby-version: 3.4.12
      - name: Verify an existing immutable release without publishing
        env:
          VERIFY_VERSION: ${{ inputs.version }}
          VERIFY_SHA256: ${{ inputs.sha256 }}
        run: >-
          bundle exec ruby script/verify_rubygems_release.rb
          --attempts 30 --interval 10
          --name agent-harness
          --version "$VERIFY_VERSION"
          --sha256 "$VERIFY_SHA256"
